apiVersion: apps/v1
kind: Deployment
metadata:
  name: causalnews
  labels:
    app: causalnews
spec:
  replicas: 2
  selector:
    matchLabels:
      app: causalnews
  template:
    metadata:
      labels:
        app: causalnews
    spec:
      containers:
        - name: causalnews
          image: causalnews:ci
          imagePullPolicy: Never   # the image is built inside Minikube
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
